# No fallback to development credentials. The initializer validates before any connection.
spring.datasource.url=${RALLYE_TEST_DB_URL}
spring.datasource.username=${RALLYE_TEST_DB_USERNAME}
spring.datasource.password=${RALLYE_TEST_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.sql.init.mode=never
# Integration tests invoke retention explicitly in isolated schemas, never via a wall-clock trigger.
rallye.audit.cleanup-enabled=false
