spring.application.name=rallye-backend

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/rallye_dev
spring.datasource.username=rallye
spring.datasource.password=${RALLYE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Multipart envelope has room for a 5 MiB image plus form headers; content is checked again by the service.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# SMTP credentials are supplied with SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD.
spring.mail.host=${RALLYE_SMTP_HOST:localhost}
spring.mail.port=${RALLYE_SMTP_PORT:25}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=${RALLYE_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.auth=${RALLYE_SMTP_AUTH:true}
spring.mail.properties.mail.debug=false

# Never log bootstrap query strings or Referer/Location headers in embedded Tomcat access logs.
# Access logging remains disabled unless explicitly enabled; a startup guard rejects unsafe patterns.
server.tomcat.accesslog.pattern=%h %l %u %t "%m %U %H" %s %b
# Connector wire diagnostics run before servlet-level redaction. Keep them below DEBUG/TRACE.
logging.level.org.apache.coyote=WARN
logging.level.org.apache.tomcat.util.net=WARN
logging.level.org.apache.catalina.connector=WARN
logging.level.org.apache.tomcat.util.http=WARN
