components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque Rallye session
    sessionCookie:
      type: apiKey
      in: cookie
      name: RALLYE_SESSION
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: 'Cookie writes: GET /api/v1/auth/csrf, jeho token a související CSRF cookie. Bearer a session
        cookie v jednom požadavku nekombinovat.'
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUID, společný namespace actor+key v CommandStore, 24h. Replay stále ověřuje kapitánství; odlišné
        parametry/operace 409. Porovnání před kontrolou otevřenosti a duplicity.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  schemas:
    MembersText:
      type: string
      maxLength: 2000
      description: Prostý text, na vstupu max 2000 Unicode code points před normalizací; následně CRLF/CR -> LF.
        Jinak zachovat mezery/řádky; aspoň jeden neprázdný řádek podle !String.isBlank(); NUL zakázán.
    EventSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - status
      - scheduledStartAt
      - startedAt
      - endAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
        status:
          type: string
          enum:
          - PLANNED
          - RUNNING
          - ENDED
        scheduledStartAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC Instant; výstup Z, přesnost ms. Vstupní offset se převede do UTC, submilisekundy zkrátí.
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC Instant; výstup Z, přesnost ms. Vstupní offset se převede do UTC, submilisekundy zkrátí.
        endAt:
          type:
          - string
          - 'null'
