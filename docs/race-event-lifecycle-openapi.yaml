          maximum: 9223372036854775807
        endSequence:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
          maximum: 9223372036854775807
      description: Samostatné období běhu. Automatický konec INCLUSIVE (receivedAt<=endAt); ruční konec SERVER_ORDER,
        shodná milisekunda se řadí serverovou sekvencí. ENDED mezery nejsou aktivním obdobím. Uzavřený řádek se
        po resume neotevírá.
      allOf:
      - if:
          properties:
            endedAt:
              type: 'null'
        then:
          properties:
            endBoundary:
              type: 'null'
            endTransitionId:
              type: 'null'
            endSequence:
              type: 'null'
        else:
          properties:
            endBoundary:
              type: string
              enum:
              - INCLUSIVE
              - SERVER_ORDER
            endTransitionId:
              type: string
              format: uuid
            endSequence:
              type: integer
              format: int64
              minimum: 1
              maximum: 9223372036854775807
