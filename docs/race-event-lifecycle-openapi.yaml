openapi: 3.1.0
info:
  title: Rallye – životní cyklus konání závodu
  version: race-event-lifecycle-api-v1
  description: 'Schválený implementovaný kontrakt. Uživatel potvrdil automatické PostgreSQL i ruční frontendové integrační ověření. Úplná časová, souběhová a databázová pravidla:
    race-event-lifecycle-api.md. Zachovává registration-api-v1 beze změn. Nenavrhuje individuální start, závodní
    odpovědi, výpočty ani publikaci. Všechny GET včetně detailu jsou čistě čtecí. Obsahuje odděleně označené aditivní
    rozšíření GET /me/registrations/summary; původní registration-api-v1 se nemění.'
servers:
- url: /api/v1
tags:
- name: Životní cyklus konání
  description: Aktivní ověřený ADMIN; žádná vlastnická výjimka, CSRF pro cookie zápisy.
- name: Souhrn vlastních registrací
  description: Aditivní rozšíření registračního API pro každý aktivní ověřený účet. ADMIN pouze vlastní souhrn; čistě
    čtecí.
paths:
  /race-events/{eventId}:
    get:
      operationId: getRaceEventLifecycle
      tags:
      - Životní cyklus konání
      summary: Detail konání s životním cyklem
      description: 'Implementováno; PostgreSQL ověření potvrdil uživatel. Rozšíření existujícího ADMIN detailu. Čistě čtecí
        GET: společný pure resolver vypočítá efektivní status podle jediného serverového času a DB snapshotu; persistedStatus
        a transitionsPending zachovají rozdíl vůči DB. Žádná materializace, historie, období, audit, změna verze
        ani jiné perzistentní změny. Read-only přístup bez FOR UPDATE pro lifecycle. Oprávnění ADMIN zůstává.'
      security:
      - bearerAuth: []
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      x-required-role: ADMIN
      responses:
        '200':
          description: Úspěch; úplné DTO.
          headers:
            Cache-Control:
              description: Citlivá administrační odpověď se neukládá do cache.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventView'
              examples:
                EventDetail:
                  $ref: '#/components/examples/EventDetail'
                EventPendingStart:
                  $ref: '#/components/examples/EventPendingStart'
                EventPendingEnd:
                  $ref: '#/components/examples/EventPendingEnd'
                EventEndedBeforeStart:
                  $ref: '#/components/examples/EventEndedBeforeStart'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '406':
          $ref: '#/components/responses/Error406'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-materializes-due-transitions: false
      x-mutates-persistence: false
    put:
      operationId: updateRaceEventLifecycle
      tags:
      - Životní cyklus konání
      summary: Změna základních údajů a termínů
      description: Implementováno; PostgreSQL ověření potvrdil uživatel. Stávající full PUT. Resolver před kontrolou verze.
        Při rovnosti nového plánovaného startu a decisionAt nastavení i START atomicky; verze může vzrůst o 2. Konec
        musí být budoucí. Po konci pouze resume. Business odmítnutí nesmí vrátit zpět samostatně oprávněný systémový
        přechod.
      security:
      - bearerAuth: []
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      x-required-role: ADMIN
      responses:
        '200':
          description: Úspěch; úplné DTO.
          headers:
            Cache-Control:
              description: Citlivá administrační odpověď se neukládá do cache.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventView'
              examples:
                EventUpdated:
                  $ref: '#/components/examples/EventUpdated'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '406':
          $ref: '#/components/responses/Error406'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdate'
            examples:
              Update:
                value:
                  version: 4
                  name: Podzimní Akce
                  description: null
                  scheduledStartAt: '2026-11-01T10:00:00Z'
                  endAt: '2026-11-01T16:00:00Z'
  /race-events/{eventId}/start:
    post:
      operationId: startRaceEvent
      tags:
      - Životní cyklus konání
      summary: Ruční oficiální start
      description: 'Implementováno; PostgreSQL ověření potvrdil uživatel. PLANNED→RUNNING; čas z aktuálního serveru. Dosud
        neuložený automatický start nepředřazovat: i po plánu použít nyní. Splatný konec má přednost. Opakování
        s novým klíčem odmítnout, přesný 24h replay vrací původní receipt. Po úspěchu GET detail. Příklad: plán
        10:00, první uložení schedulerem v 10:01 → effectiveAt=10:00; první uložení ručním START v 10:01 → effectiveAt=10:01.
        Předchozí GET včetně opakovaných nic neuloží a neovlivní vítěze.'
      security:
      - bearerAuth: []
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-required-role: ADMIN
      responses:
        '200':
          description: Úspěch; úplné DTO.
          headers:
            Cache-Control:
              description: Citlivá administrační odpověď se neukládá do cache.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleCommandResult'
              examples:
                Started:
                  $ref: '#/components/examples/Started'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '406':
          $ref: '#/components/responses/Error406'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
            examples:
              Start:
                value:
                  version: 5
  /race-events/{eventId}/end:
    post:
      operationId: endRaceEvent
      tags:
      - Životní cyklus konání
      summary: Ruční ukončení konání
      description: Implementováno; PostgreSQL ověření potvrdil uživatel. PLANNED/RUNNING→ENDED v aktuálním serverovém čase.
        Žádný klientský historický čas. Konec PLANNED nevytváří start/období. Pokud už dosáhl endAt, přednost automatického
        konce přesně endAt a ruční záměr je odmítnut; kontrola verze před kontrolou stavu.
      security:
      - bearerAuth: []
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-required-role: ADMIN
      responses:
        '200':
          description: Úspěch; úplné DTO.
          headers:
            Cache-Control:
              description: Citlivá administrační odpověď se neukládá do cache.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleCommandResult'
              examples:
                Ended:
                  $ref: '#/components/examples/Ended'
                EndedBeforeStart:
                  $ref: '#/components/examples/EndedBeforeStart'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '406':
          $ref: '#/components/responses/Error406'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
            examples:
              End:
                value:
                  version: 6
              BeforeFirstStart:
                value:
                  version: 4
  /race-events/{eventId}/resume:
    post:
      operationId: resumeRaceEvent
      tags:
      - Životní cyklus konání
      summary: Obnovení ukončeného konání
      description: Implementováno; PostgreSQL ověření potvrdil uživatel. ENDED→RUNNING nyní, opakovaně bez limitu. Výslovný
        budoucí endAt nebo null, resultsFinalizedAt musí být null. Nové období; zachovat původní konce, registrace/override/průběhy.
        Invalidovat předchozí uzávěrku, nepočítat výsledky. Žádné zpětné přijímání odmítnutých odpovědí.
      security:
      - bearerAuth: []
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-required-role: ADMIN
      responses:
        '200':
          description: Úspěch; úplné DTO.
          headers:
            Cache-Control:
              description: Citlivá administrační odpověď se neukládá do cache.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleCommandResult'
              examples:
                Resumed:
                  $ref: '#/components/examples/Resumed'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '406':
          $ref: '#/components/responses/Error406'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeCommand'
            examples:
              WithDeadline:
                value:
                  version: 7
                  endAt: '2026-11-01T17:00:00Z'
              WithoutDeadline:
                value:
                  version: 7
                  endAt: null
  /race-events/{eventId}/lifecycle-history:
    get:
      operationId: getRaceEventLifecycleHistory
      tags:
      - Životní cyklus konání
      summary: Historie přechodů a změn termínů
      description: Implementováno; PostgreSQL ověření potvrdil uživatel. Pure GET, nic nematerializuje. sequence DESC,id DESC
        před offsetovým stránkováním; obsahuje konfiguraci i skutečné přechody s jejich odlišením. Nezávislé na
        auditní retenci.
      security:
      - bearerAuth: []
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      x-required-role: ADMIN
      responses:
        '200':
          description: Úspěch; úplné DTO.
          headers:
            Cache-Control:
              description: Citlivá administrační odpověď se neukládá do cache.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleHistoryPage'
              examples:
                LifecycleHistory:
                  $ref: '#/components/examples/LifecycleHistory'
                EmptyStoredHistory:
                  $ref: '#/components/examples/EmptyStoredHistory'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '406':
          $ref: '#/components/responses/Error406'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-materializes-due-transitions: false
      x-mutates-persistence: false
  /race-events/{eventId}/running-periods:
    get:
      operationId: getRaceEventRunningPeriods
      tags:
      - Životní cyklus konání
      summary: Období aktivního běhu
      description: Implementováno; PostgreSQL ověření potvrdil uživatel. Pure GET, number DESC,id DESC. Nezaměňovat s administrační
        historií. Intervaly zachovají dřívější konce a mezery ENDED i po obnovení. Přesné pravidlo příjmu a pořadí
        viz Markdown §4.
      security:
      - bearerAuth: []
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      x-required-role: ADMIN
      responses:
        '200':
          description: Úspěch; úplné DTO.
          headers:
            Cache-Control:
              description: Citlivá administrační odpověď se neukládá do cache.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunningPeriodPage'
              examples:
                RunningPeriods:
                  $ref: '#/components/examples/RunningPeriods'
                EmptyStoredPeriods:
                  $ref: '#/components/examples/EmptyStoredPeriods'
                StoredPeriodBeforePendingEnd:
                  $ref: '#/components/examples/StoredPeriodBeforePendingEnd'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '406':
          $ref: '#/components/responses/Error406'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-materializes-due-transitions: false
      x-mutates-persistence: false
  /me/registrations/summary:
    get:
      operationId: getMyRegistrationsSummary
      tags:
      - Souhrn vlastních registrací
      summary: Počet aktivních registrací vlastních posádek
      description: 'Implementováno; PostgreSQL ověření potvrdil uživatel. Aditivní rozšíření registračního API navržené společně s lifecycle-api-v1.
        Aktivní ověřený účet, nevyžaduje ADMIN; i ADMIN vidí pouze vlastní posádky. Účet pouze z relace, žádné path/query
        parametry či request tělo. Nepodporované query parametry jsou 400. Čistě čtecí GET bez CSRF a materializace.
        Jediný agregační SELECT, jedno decisionAt a PostgreSQL snapshot: počet crew_registration s aktuálním captain_account_id
        a efektivním PLANNED/RUNNING. Dvě posádky ve stejném konání jsou 2; override, individuální start/dokončení
        a historický kapitán nemají vliv. Dosažený endAt vyřadí z počtu i před schedulerem; pending start se započítá.
        Chyba není náhradní nula.'
      security:
      - bearerAuth: []
      - sessionCookie: []
      parameters: []
      x-required-account-state: ACTIVE_VERIFIED
      x-materializes-due-transitions: false
      x-mutates-persistence: false
      x-reject-unknown-query-parameters: true
      responses:
        '200':
          description: Souhrn aktuálně přihlášeného účtu, včetně legitimní nuly.
          headers:
            Cache-Control:
              description: Citlivá administrační odpověď se neukládá do cache.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyRegistrationsSummary'
              examples:
                MyRegistrationsSummaryThree:
                  $ref: '#/components/examples/MyRegistrationsSummaryThree'
                MyRegistrationsSummaryEmpty:
                  $ref: '#/components/examples/MyRegistrationsSummaryEmpty'
        '401':
          $ref: '#/components/responses/Error401'
        '405':
          $ref: '#/components/responses/Error405'
        '406':
          $ref: '#/components/responses/Error406'
        '500':
          $ref: '#/components/responses/Error500'
        '400':
          description: Nepodporované parametry; účet nelze přepnout klientskou hodnotou.
          content:
            application/problem+json:
              schema:
                type: object
                additionalProperties: false
                required:
                - type
                - title
                - status
                - code
                properties:
                  type:
                    type: string
                    format: uri-reference
                  title:
                    type: string
                  status:
                    type: integer
                    const: 400
                  code:
                    type: string
                    enum:
                    - INVALID_REQUEST
                  instance:
                    type: string
                    format: uri-reference
                description: Stávající application/problem+json. Žádné SQL, tokeny, cookies ani osobní údaje. instance
                  je volitelné.
              examples:
                Error:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    code: INVALID_REQUEST
          headers:
            Cache-Control:
              description: Ani chybová odpověď se neukládá do cache.
              schema:
                type: string
                const: no-store
        '403':
          description: Stávající bezpečnostní odmítnutí; role ADMIN není požadována.
          content:
            application/problem+json:
              schema:
                type: object
                additionalProperties: false
                required:
                - type
                - title
                - status
                - code
                properties:
                  type:
                    type: string
                    format: uri-reference
                  title:
                    type: string
                  status:
                    type: integer
                    const: 403
                  code:
                    type: string
                    enum:
                    - ACCESS_DENIED
                  instance:
                    type: string
                    format: uri-reference
                description: Stávající application/problem+json. Žádné SQL, tokeny, cookies ani osobní údaje. instance
                  je volitelné.
              examples:
                Error:
                  value:
                    type: about:blank
                    title: Forbidden
                    status: 403
                    code: ACCESS_DENIED
          headers:
            Cache-Control:
              description: Ani chybová odpověď se neukládá do cache.
              schema:
                type: string
                const: no-store
        '503':
          description: Nelze bezpečně určit lifecycle; nevracet nulu.
          content:
            application/problem+json:
              schema:
                type: object
                additionalProperties: false
                required:
                - type
                - title
                - status
                - code
                properties:
                  type:
                    type: string
                    format: uri-reference
                  title:
                    type: string
                  status:
                    type: integer
                    const: 503
                  code:
                    type: string
                    enum:
                    - RACE_EVENT_LIFECYCLE_UNAVAILABLE
                  instance:
                    type: string
                    format: uri-reference
                description: Stávající application/problem+json. Žádné SQL, tokeny, cookies ani osobní údaje. instance
                  je volitelné.
              examples:
                Error:
                  value:
                    type: about:blank
                    title: Service Unavailable
                    status: 503
                    code: RACE_EVENT_LIFECYCLE_UNAVAILABLE
          headers:
            Cache-Control:
              description: Ani chybová odpověď se neukládá do cache.
              schema:
                type: string
                const: no-store
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque Rallye session
    sessionCookie:
      type: apiKey
      in: cookie
      name: RALLYE_SESSION
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Maskovaný token a související cookie získat GET /api/v1/auth/csrf. Nekombinovat session cookie
        s Bearer.
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUID; společný namespace aktér/klíč, 24h; při retry stejný klíč i celé tělo. Neobsahuje tajemství.
  schemas:
    Version:
      type: integer
      format: int64
      minimum: 0
      maximum: 9223372036854775807
    EventState:
      type: string
      enum:
      - PLANNED
      - RUNNING
      - ENDED
    VersionCommand:
      type: object
      additionalProperties: false
      required:
      - version
      properties:
        version:
          $ref: '#/components/schemas/Version'
      description: Očekávaná společná verze konání; nepřijímá čas ani jiné parametry.
    ResumeCommand:
      type: object
      additionalProperties: false
      required:
      - version
      - endAt
      properties:
        version:
          $ref: '#/components/schemas/Version'
        endAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339; výstup Z, milisekundová přesnost. Vstupní explicitní offset se normalizuje do
            UTC a zlomek zkrátí na milisekundy.
      description: 'endAt je povinné: budoucí čas > decisionAt nebo explicitní null pro neomezený běh.'
    EventUpdate:
      type: object
      additionalProperties: false
      required:
      - version
      - name
      properties:
        version:
          $ref: '#/components/schemas/Version'
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
        scheduledStartAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339; výstup Z, milisekundová přesnost. Vstupní explicitní offset se normalizuje do
            UTC a zlomek zkrátí na milisekundy.
        endAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339; výstup Z, milisekundová přesnost. Vstupní explicitní offset se normalizuje do
            UTC a zlomek zkrátí na milisekundy.
      description: 'Stávající úplný PUT, nikoli PATCH. Vynechané nullable pole znamená null. PLANNED: všechny údaje.
        RUNNING: mění se jen endAt, ostatní musí zůstat shodné. ENDED: odmítnuto. Nový plán >= decisionAt, nový
        konec > decisionAt; vazba plán<konec se nevyžaduje. No-op se správnou verzí bez změny/auditu; systémový
        přechod nezávislý.'
    Lifecycle:
      type: object
      additionalProperties: false
      required:
      - serverTime
      - persistedStatus
      - transitionsPending
      - startedAt
      - effectiveStartedAt
      - lastEndedAt
      - activePeriodId
      - periodNumber
      - closureRevision
      - currentClosureRevision
      - resultsFinalizedAt
      - canStart
      - canEnd
      - canResume
      - canEditScheduledStartAt
      - canEditEndAt
      - canEditBasicDetails
      - resumeBlockedReason
      properties:
        serverTime:
          type: string
          format: date-time
          description: Jediný autoritativní serverový rozhodovací čas pro celé čtení; ne čas klienta.
        persistedStatus:
          $ref: '#/components/schemas/EventState'
          description: Skutečně uložený stav; může se lišit od efektivního EventView.status.
        transitionsPending:
          type: boolean
          description: Existuje splatný dosud neuložený automatický přechod. GET jej neprovede.
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Pouze první uložený start. Pending první start nebo ukončení před prvním startem: null.'
        effectiveStartedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Při pending startu plánovaný efektivní začátek; při skutečně uloženém startu jeho čas. Při
            přímém konci z PLANNED null.
        lastEndedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Pouze poslední uložené ukončení, zůstává i po resume. Pending konec tuto hodnotu nepřepisuje.
        activePeriodId:
          type:
          - string
          - 'null'
          format: uuid
          description: Pouze již uložené a nyní efektivně aktivní období. Null při pending prvním startu i jakémkoli
            efektivním ENDED. GET období může při pending konci ještě vracet uložený otevřený řádek.
        periodNumber:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Počet dosud uložených období; GET jej nikdy nezvyšuje.
        closureRevision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Poslední uložený čítač uzávěrek; GET jej nezvyšuje.
        currentClosureRevision:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Pouze aktuální uložená uzávěrka ENDED, null při běhu a pending konci.
        resultsFinalizedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339; výstup Z, milisekundová přesnost. Vstupní explicitní offset se normalizuje do
            UTC a zlomek zkrátí na milisekundy.
        canStart:
          type: boolean
          description: True v PLANNED bez splatného konce, i pokud start je pouze pending a efektivní status už
            RUNNING. První úspěšně uložený ruční/systémový přechod vyhraje.
        canEnd:
          type: boolean
          description: True před startem i při běhu, včetně pending startu; false při efektivním ENDED. Ruční PLANNED→ENDED
            bez fiktivního startu/období.
        canResume:
          type: boolean
          description: 'True jen při uloženém ENDED bez definitivní publikace. Pending konec: false do materializace
            schedulerem/relevantním zápisem.'
        canEditScheduledStartAt:
          type: boolean
          description: True jen PLANNED/PLANNED bez pending; GET stav nezmění.
        canEditEndAt:
          type: boolean
          description: True při PLANNED nebo RUNNING bez pending a před koncem; při pending false.
        canEditBasicDetails:
          type: boolean
          description: True jen PLANNED/PLANNED bez pending.
        resumeBlockedReason:
          type:
          - string
          - 'null'
          enum:
          - NOT_ENDED
          - RESULTS_FINALIZED
          - PENDING_TRANSITION
          - null
          description: RESULTS_FINALIZED při doložené definitivní publikaci; jinak PENDING_TRANSITION při pending
            konci; jinak NOT_ENDED před efektivním koncem; jinak null.
      description: 'Stejná pravidla pro čistě čtecí detail i seznam. startedAt je první uložený start; lastEndedAt
        pouze uložený poslední konec i po resume. Pending start: efektivní RUNNING, persisted PLANNED, startedAt/activePeriodId
        null, effectiveStartedAt=plán; ruční canStart/canEnd=true, canEdit*=false. Pending konec: efektivní ENDED,
        activePeriodId/currentClosureRevision null, poslední uložené startedAt/lastEndedAt/čítače beze změn; canStart/canEnd/canResume/canEdit*=false,
        resumeBlockedReason=PENDING_TRANSITION. UUID/revize se nevymýšlejí a GET nic neukládá. Přesná tabulka v
        Markdown §3; definitivní publikace má jako zábrana přednost.'
    EventView:
      type: object
      additionalProperties: false
      required:
