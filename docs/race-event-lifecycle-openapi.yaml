      - updatedAt
      - defaultWrongCodePenaltyPoints
      - sourceTemplateName
      - sourceTemplateNameIsSnapshot
      - lifecycle
      properties:
        id:
          type: string
          format: uuid
        sourceTemplateId:
          type: string
          format: uuid
        sourceTemplateVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        skipPenaltyPoints:
          type: integer
          format: int64
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        status:
          $ref: '#/components/schemas/EventState'
          description: Efektivní PLANNED/RUNNING/ENDED podle společného rozhodovacího času; GET nikdy nematerializuje.
        scheduledStartAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339; výstup Z, milisekundová přesnost. Vstupní explicitní offset se normalizuje do
            UTC a zlomek zkrátí na milisekundy.
        endAt:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339; výstup Z, milisekundová přesnost. Vstupní explicitní offset se normalizuje do
            UTC a zlomek zkrátí na milisekundy.
        version:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        createdAt:
          type: string
          format: date-time
          description: UTC RFC3339; výstup Z, milisekundová přesnost. Vstupní explicitní offset se normalizuje do
            UTC a zlomek zkrátí na milisekundy.
        updatedAt:
          type: string
          format: date-time
          description: UTC RFC3339; výstup Z, milisekundová přesnost. Vstupní explicitní offset se normalizuje do
            UTC a zlomek zkrátí na milisekundy.
        defaultWrongCodePenaltyPoints:
          type: integer
          format: int64
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        sourceTemplateName:
          type: string
        sourceTemplateNameIsSnapshot:
          type: boolean
        lifecycle:
          $ref: '#/components/schemas/Lifecycle'
      description: Všech 15 existujících polí EventService.View plus lifecycle. status je efektivní; uložený stav
        je lifecycle.persistedStatus. Detail i seznam jsou čistě čtecí, bez ukládání časových přechodů. Žádná konfigurace
        stanovišť ani údaje členů.
    LifecycleHistoryEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - raceEventId
      - sequence
      - kind
      - type
      - fromStatus
      - toStatus
      - effectiveAt
      - processedAt
      - trigger
      - cause
      - actorKind
      - actorAccountId
      - versionBefore
      - versionAfter
      - scheduledStartAtBefore
      - scheduledStartAtAfter
      - endAtBefore
      - endAtAfter
      - periodId
      - closureRevision
      - invalidatedClosureRevision
      properties:
        id:
          type: string
          format: uuid
        raceEventId:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        kind:
          type: string
          enum:
          - CONFIGURATION
          - TRANSITION
        type:
          type: string
          enum:
          - TIMES_UPDATED
          - STARTED
          - ENDED
          - RESUMED
        fromStatus:
          $ref: '#/components/schemas/EventState'
        toStatus:
          $ref: '#/components/schemas/EventState'
        effectiveAt:
          type: string
          format: date-time
          description: UTC RFC3339; výstup Z, milisekundová přesnost. Vstupní explicitní offset se normalizuje do
            UTC a zlomek zkrátí na milisekundy.
        processedAt:
          type: string
          format: date-time
          description: UTC RFC3339; výstup Z, milisekundová přesnost. Vstupní explicitní offset se normalizuje do
            UTC a zlomek zkrátí na milisekundy.
        trigger:
          type: string
          enum:
          - ADMIN
          - SCHEDULER
          - API_RECONCILIATION
        cause:
          type: string
          enum:
          - SETTINGS_UPDATE
          - MANUAL
          - SCHEDULED_START
          - END_AT
        actorKind:
          type: string
          enum:
          - USER
          - SYSTEM
        actorAccountId:
          type:
          - string
          - 'null'
          format: uuid
        versionBefore:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        versionAfter:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        scheduledStartAtBefore:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339; výstup Z, milisekundová přesnost. Vstupní explicitní offset se normalizuje do
            UTC a zlomek zkrátí na milisekundy.
        scheduledStartAtAfter:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339; výstup Z, milisekundová přesnost. Vstupní explicitní offset se normalizuje do
            UTC a zlomek zkrátí na milisekundy.
        endAtBefore:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339; výstup Z, milisekundová přesnost. Vstupní explicitní offset se normalizuje do
            UTC a zlomek zkrátí na milisekundy.
        endAtAfter:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339; výstup Z, milisekundová přesnost. Vstupní explicitní offset se normalizuje do
            UTC a zlomek zkrátí na milisekundy.
        periodId:
          type:
          - string
          - 'null'
          format: uuid
        closureRevision:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        invalidatedClosureRevision:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
          maximum: 9223372036854775807
      description: Trvalá neměnná lifecycle historie, nezávislá na retenci audit_event. sequence je monotónní pořadí
        v konání, mezery přípustné. TIMES_UPDATED je konfigurace bez změny stavu; ostatní skutečné přechody. END
        před startem má periodId null. END zakládá closureRevision, RESUME invalidatedClosureRevision; nic zpětně
        nemaže.
      allOf:
      - if:
          properties:
            kind:
              const: CONFIGURATION
        then:
          properties:
            type:
              const: TIMES_UPDATED
            cause:
              const: SETTINGS_UPDATE
            trigger:
              const: ADMIN
            actorKind:
              const: USER
        else:
          properties:
            type:
              type: string
              enum:
              - STARTED
              - ENDED
              - RESUMED
      - if:
          properties:
            actorKind:
              const: SYSTEM
        then:
          properties:
            actorAccountId:
              type: 'null'
            cause:
              type: string
              enum:
              - SCHEDULED_START
              - END_AT
        else:
          properties:
            actorAccountId:
              type: string
              format: uuid
      - if:
          properties:
            type:
              const: STARTED
        then:
          properties:
            fromStatus:
              const: PLANNED
            toStatus:
              const: RUNNING
            periodId:
              type: string
              format: uuid
            closureRevision:
              type: 'null'
            invalidatedClosureRevision:
              type: 'null'
      - if:
          properties:
            type:
              const: ENDED
        then:
          properties:
            fromStatus:
              type: string
              enum:
              - PLANNED
              - RUNNING
            toStatus:
              const: ENDED
            closureRevision:
              type: integer
              format: int64
              minimum: 1
            invalidatedClosureRevision:
              type: 'null'
      - if:
          properties:
            type:
              const: RESUMED
        then:
          properties:
            fromStatus:
              const: ENDED
            toStatus:
              const: RUNNING
            periodId:
              type: string
              format: uuid
            cause:
              const: MANUAL
            closureRevision:
              type: 'null'
            invalidatedClosureRevision:
              type: integer
              format: int64
              minimum: 1
